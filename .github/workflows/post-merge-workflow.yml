name: Post merge

on:
  pull_request:
    types:
      - closed

permissions:
  id-token: write
  contents: read

jobs:
  delete-preview-stack:
    name: Delete preview stack
    runs-on: ubuntu-latest
    environment: integration-tests
    concurrency: deploy-development-${{ github.head_ref || github.ref_name }}

    steps:
      - name: Get stack name
        uses: govuk-one-login/github-actions/beautify-branch-name@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: get-stack-name
        with:
          usage: Stack name
          prefix: preview-oauth-common
          length-limit: 37
          verbose: false

      - name: Delete stack
        uses: govuk-one-login/github-actions/sam/delete-stacks@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          stack-names: ${{ steps.get-stack-name.outputs.pretty-branch-name }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          verbose: true
          
  delete-ipv-preview-stack:
    name: Delete IPV preview stack
    runs-on: ubuntu-latest
    environment: integration-tests
    concurrency: deploy-ipv-${{ github.head_ref || github.ref_name }}

    steps:
      - name: Get stack name
        uses: govuk-one-login/github-actions/beautify-branch-name@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: get-stack-name
        with:
          usage: Stack name
          prefix: preview-oauth-ipv
          length-limit: 37
          verbose: false

      - name: Delete stack
        uses: govuk-one-login/github-actions/sam/delete-stacks@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          stack-names: ${{ steps.get-stack-name.outputs.pretty-branch-name }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          verbose: true

  delete-migrating-preview-stack:
    name: Delete migrating preview stack
    runs-on: ubuntu-latest
    environment: integration-tests
    concurrency: deploy-migrating-${{ github.head_ref || github.ref_name }}

    steps:
      - name: Get stack name
        uses: govuk-one-login/github-actions/beautify-branch-name@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: get-stack-name
        with:
          usage: Stack name
          prefix: preview-oauth-migrating
          length-limit: 37
          verbose: false

      - name: Delete stack
        uses: govuk-one-login/github-actions/sam/delete-stacks@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          stack-names: ${{ steps.get-stack-name.outputs.pretty-branch-name }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          verbose: true