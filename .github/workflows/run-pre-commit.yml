name: Run pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          all-files: true
          pull-repository: true
          install-dependencies: true
