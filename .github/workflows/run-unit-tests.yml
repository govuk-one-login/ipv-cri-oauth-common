name: Run unit tests

on:
  workflow_call:

jobs:
  run-unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: lambdas/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: lambdas
        run: npm run test:coverage -- --config vitest.config.ts

      - name: Fix lcov.info paths
        run: sed -i "s|src/|lambdas/src/|" lambdas/coverage/lcov.info

      - name: Archive coverage results
        id: upload-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lambdas/coverage/lcov.info
          retention-days: 3
