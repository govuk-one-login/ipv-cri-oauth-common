name: Publish to SAR (dev)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish app to SAR
    runs-on: ubuntu-latest
    environment: sar-publish-dev
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish to SAR
        uses: ./.github/actions/sar-publish
        with:
          roleArn: ${{ vars.ROLE_ARN }}
          artifactBucketName: ${{ vars.ARTIFACT_BUCKET_NAME }}
          signingProfile: SigningProfile_2ThWsziIli1v
          allowOverwriteOfExistingVersion: true
