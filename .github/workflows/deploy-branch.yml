name: Deploy preview stack

on:
  workflow_call:
    outputs:
      stack-name:
        description: The deployed stack name
        value: ${{ jobs.deploy.outputs.stack-name }}
      stack-outputs:
        description: The deployed stack outputs
        value: ${{ jobs.deploy.outputs.stack-outputs }}
      aws-region:
        description: The region in which the stack was deployed
        value: ${{ jobs.deploy.outputs.aws-region }}
      migrating-stack-name:
        description: The deployed stack name
        value: ${{ jobs.deploy-migrating.outputs.stack-name }}
      migrating-stack-outputs:
        description: The deployed stack outputs
        value: ${{ jobs.deploy-migrating.outputs.stack-outputs }}
      migrating-aws-region:
        description: The region in which the stack was deployed
        value: ${{ jobs.deploy-migrating.outputs.aws-region }}
      ipv-stack-name:
        description: The deployed stack name
        value: ${{ jobs.deploy-ipv.outputs.stack-name }}
      ipv-stack-outputs:
        description: The deployed stack outputs
        value: ${{ jobs.deploy-ipv.outputs.stack-outputs }}
      ipv-aws-region:
        description: The region in which the stack was deployed
        value: ${{ jobs.deploy-ipv.outputs.aws-region }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    environment: integration-tests
    concurrency:
      group: check-repo-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Build SAM application
        uses: govuk-one-login/github-actions/sam/build-application@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: build
        with:
          template: infrastructure/template.yaml
          cache-name: common-oauth-${{ github.head_ref || github.ref_name }}
          pull-repository: false

  deploy:
    name: Deploy stack
    needs: build
    runs-on: ubuntu-latest
    environment: integration-tests
    outputs:
      stack-name: ${{ steps.deploy.outputs.stack-name }}
      stack-outputs: ${{ steps.deploy.outputs.stack-outputs }}
      aws-region: ${{ steps.deploy.outputs.aws-region }}
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Deploy OAuthCommon
        uses: govuk-one-login/github-actions/sam/deploy-stack@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: deploy
        env:
          AWS_REGION: eu-west-2
        with:
          sam-deployment-bucket: ${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2
          stack-name-prefix: preview-oauth-common
          stack-name-length-limit: 37
          cache-name: common-oauth-${{ github.head_ref || github.ref_name }}
          s3-prefix: preview
          pull-repository: true
          delete-failed-stack: true
          tags: |
            cri:component=ipv-cri-common-lambdas
            cri:stack-type=preview
            cri:application=Orange
            cri:deployment-source=github-actions
          parameters: |
            AuditEventNamePrefix=IPV_COMMON_CRI
            CriIdentifier=di-ipv-cri-check-hmrc-api
            CriAudience=https://review-hc.dev.account.gov.uk
            CriVcIssuer=https://review-hc.dev.account.gov.uk
            CriPrivateApiGwName=check-hmrc-cri-api-private
            CriPublicApiGwName=check-hmrc-cri-api-private
            Environment=dev
            IPVCoreRedirectURI=https://identity.staging.account.gov.uk/credential-issuer/callback?id=nino
            IPVCoreStubJwksEndpoint=https://test-resources.review-hc.dev.account.gov.uk/.well-known/jwks.json
            KeyRotationFallback=true
            LambdaVersionHash=${{ github.sha }}
            LambdaVpcConfiguration=di-devplatform-deploy

  deploy-ipv:
    name: Deploy IPV stack
    needs: build
    runs-on: ubuntu-latest
    environment: integration-tests
    outputs:
      stack-name: ${{ steps.deploy-ipv.outputs.stack-name }}
      stack-outputs: ${{ steps.deploy-ipv.outputs.stack-outputs }}
      aws-region: ${{ steps.deploy-ipv.outputs.aws-region }}
    concurrency:
      group: deploy-ipv-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Deploy an IPV OAuthCommon
        uses: govuk-one-login/github-actions/sam/deploy-stack@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: deploy-ipv
        env:
          AWS_REGION: eu-west-2
        with:
          sam-deployment-bucket: ${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2
          stack-name-prefix: preview-oauth-ipv
          stack-name-length-limit: 37
          cache-name: common-oauth-${{ github.head_ref || github.ref_name }}
          s3-prefix: preview
          pull-repository: true
          delete-failed-stack: true
          tags: |
            cri:component=ipv-cri-common-lambdas
            cri:stack-type=preview
            cri:application=Orange
            cri:deployment-source=github-actions
          parameters: |
            AuditEventNamePrefix=IPV_COMMON_CRI
            AuthorizationRequestType=IPV
            CriIdentifier=di-ipv-cri-check-hmrc-api
            CriAudience=https://review-hc.dev.account.gov.uk
            CriVcIssuer=https://review-hc.dev.account.gov.uk
            CriPrivateApiGwName=check-hmrc-cri-api-private
            CriPublicApiGwName=check-hmrc-cri-api-private
            Environment=dev
            IPVCoreRedirectURI=https://identity.staging.account.gov.uk/credential-issuer/callback?id=nino
            IPVCoreStubJwksEndpoint=https://test-resources.review-hc.dev.account.gov.uk/.well-known/jwks.json
            KeyRotationFallback=true
            LambdaVersionHash=${{ github.sha }}
            LambdaVpcConfiguration=di-devplatform-deploy

  deploy-migrating:
    name: Deploy migrating stack
    needs: build
    runs-on: ubuntu-latest
    environment: integration-tests
    outputs:
      stack-name: ${{ steps.deploy-migrating.outputs.stack-name }}
      stack-outputs: ${{ steps.deploy-migrating.outputs.stack-outputs }}
      aws-region: ${{ steps.deploy-migrating.outputs.aws-region }}
    concurrency:
      group: deploy-migrating-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Deploy a migrating OAuthCommon
        uses: govuk-one-login/github-actions/sam/deploy-stack@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: deploy-migrating
        env:
          AWS_REGION: eu-west-2
        with:
          sam-deployment-bucket: ${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2
          stack-name-prefix: preview-oauth-migrating
          stack-name-length-limit: 37
          cache-name: common-oauth-${{ github.head_ref || github.ref_name }}
          s3-prefix: preview
          pull-repository: true
          delete-failed-stack: true
          tags: |
            cri:component=ipv-cri-common-lambdas
            cri:stack-type=preview
            cri:application=Orange
            cri:deployment-source=github-actions
          parameters: |
            AuditEventNamePrefix=IPV_COMMON_CRI
            CommonLambdasStackName=common-cri-api
            CommonLambdasUsesCMK=true
            CriIdentifier=di-ipv-cri-check-hmrc-api
            CriAudience=https://review-hc.dev.account.gov.uk
            CriVcIssuer=https://review-hc.dev.account.gov.uk
            CriPrivateApiGwName=check-hmrc-cri-api-private
            CriPublicApiGwName=check-hmrc-cri-api-private
            Environment=dev
            IPVCoreRedirectURI=https://identity.staging.account.gov.uk/credential-issuer/callback?id=nino
            IPVCoreStubJwksEndpoint=https://test-resources.review-hc.dev.account.gov.uk/.well-known/jwks.json
            KeyRotationFallback=true
            LambdaVersionHash=${{ github.sha }}
            LambdaVpcConfiguration=di-devplatform-deploy
